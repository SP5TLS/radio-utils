name: Publish to crates.io

# Tagging `vX.Y.Z` publishes all four crates in dependency order. The
# emulator-binary build (release.yml) and this workflow are independent —
# they both fire on the same tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ALSA + udev headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Verify tag matches workspace version
        # Cheap protection against publishing the wrong number. Skipped on
        # workflow_dispatch (no tag context).
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag $tag does not match workspace version $ws"
            exit 1
          fi
          echo "Publishing $ws"

      - name: Publish radio-utils-cw-decoder
        # No path deps on the other workspace crates, so order vs. the
        # rest is irrelevant.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radio-utils-cw-decoder

      - name: Publish radio-utils-keyer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radio-utils-keyer

      - name: Publish radio-utils-protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radio-utils-protocol

      - name: Wait for crates.io index to propagate
        # radio-utils-emu's dependency resolver needs to see the just-published
        # protocol crate before it will publish.
        run: sleep 45

      - name: Publish radio-utils-emu
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radio-utils-emu
