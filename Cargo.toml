[workspace]
members = [
    "crates/radio-utils-cw-decoder",
    "crates/radio-utils-emu",
    "crates/radio-utils-keyer",
    "crates/radio-utils-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sp5tls/radio-utils"
authors = ["Michal Zabielski <zabielski.michal@gmail.com>"]

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
num-complex = "0.4"
ringbuf = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.4", features = ["derive"] }
rand = "0.9"
rand_distr = "0.5"
if-addrs = "0.7"
libm = "0.2"
bincode = "1.3"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
