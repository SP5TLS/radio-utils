[package]
name = "radio-utils-keyer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CW keyer engine — iambic A/B, straight key, macros, QSK"
readme = "README.md"
keywords = ["ham-radio", "morse", "cw", "keyer", "amateur-radio"]
categories = ["embedded", "no-std", "multimedia::audio"]
rust-version = "1.87"

[features]
default = ["std"]
std = ["serde/std", "log/std", "dep:crossbeam-channel",
       "dep:web-time", "dep:serialport", "dep:midir",
       "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:gloo-timers",
       "dep:jni"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
log = { workspace = true }
libm = { workspace = true }
crossbeam-channel = { workspace = true, optional = true }
# Fixed-size ring buffer for the engine's transition log — keeps record /
# evict at O(1) without a heap allocation per overflow.  Same major as
# the firmware crate so cargo only compiles heapless once.
heapless = { version = "0.8", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
web-time = { version = "1", optional = true }

# `serialport` only ships a usable backend on desktop OSes — Android USB-OTG
# goes through `UsbManager` (Java), which is handled by `serial_android.rs`
# via JNI instead.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
serialport = { version = "4", optional = true }
midir = { version = "0.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Navigator", "Window", "console",
    "MidiAccess", "MidiInput", "MidiInputMap", "MidiMessageEvent", "MidiPort",
    "Serial", "SerialPort", "SerialInputSignals", "SerialOptions", "SerialPortRequestOptions",
] }
gloo-timers = { version = "0.3", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
